{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>🔐 Вход</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="alert alert-error">
                ❌ {{ form.non_field_errors|default:"Неверное имя пользователя или пароль" }}
            </div>
            {% endif %}
            
            <div class="form-group">
                <label for="id_username">Email или имя пользователя</label>
                <input type="text" name="username" id="id_username" required 
                       autofocus placeholder="Ваш логин или email">
            </div>
            
            <div class="form-group">
                <label for="id_password">Пароль</label>
                <input type="password" name="password" id="id_password" required 
                       placeholder="Ваш пароль">
            </div>
            
            <button type="submit" class="btn-primary">🚀 Войти</button>
        </form>
        
        <div class="auth-links">
            <p>Нет аккаунта? <a href="{% url 'register' %}">📝 Зарегистрироваться</a></p>
            <p style="margin-top: 10px; font-size: 0.9rem;">
                <a href="{% url 'home' %}">← На главную</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
